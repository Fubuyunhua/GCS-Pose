name: Portable source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install PyYAML ruff
      - run: ruff check --select F821 train.py train_3dhp.py scripts lib/utils tests
      - run: python -m compileall -q train.py train_3dhp.py lib scripts tests
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
